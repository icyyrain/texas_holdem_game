# nginx in front of the table: put this in /etc/nginx/conf.d/holdem.conf.
# Certificates from certbot (sudo certbot --nginx -d poker.example.com) or your own.
# Clients join with  wss://poker.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poker.example.com;

    ssl_certificate     /etc/letsencrypt/live/poker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poker.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The server pings every 20 seconds; this only has to be longer than that.
        proxy_read_timeout 120s;
    }
}
