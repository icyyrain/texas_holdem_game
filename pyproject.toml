[project]
name = "holdem-game"
version = "0.1.0"
description = "A multiplayer No-Limit Texas Hold'em game with a tkinter client and websocket server."
requires-python = ">=3.11"
dependencies = ["websockets"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
